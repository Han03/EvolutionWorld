<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EvolutionWorld · 无缝世界</title>
  <link rel="stylesheet" href="./css/login.css" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="ew-loading">
  <!-- 2D 渲染容器 -->
  <div id="app"></div>

  <!-- ═══════════ HUD ═══════════ -->
  <div id="hud" class="hidden">

    <!-- ── 顶栏 ── -->
    <div class="hud-top-bar">
      <div class="hud-top-left">
        <div class="hud-logo">EVOLUTIONWORLD</div>
        <div id="hud-version" style="font-size:10px;color:rgba(255,255,255,0.4);margin-left:6px;">v-</div>
        <div id="hud-conn" class="hud-status-chip">…</div>
      </div>
      <div class="hud-top-right">
        <div id="hud-info" class="hud-info-block">
          <div><b id="hud-user">-</b></div>
          <div id="hud-pos">x:0 z:0</div>
          <div id="hud-fps">fps:0</div>
        </div>
      </div>
    </div>

    <!-- ── 精英血条（顶部居中） ── -->
    <div id="elite-bar" class="hidden">
      <div class="elite-skull">💀</div>
      <div class="elite-info">
        <div id="elite-name">世界精英</div>
        <div class="elite-track"><div id="elite-fill"></div></div>
      </div>
      <span id="elite-hp">0/0</span>
    </div>

    <!-- ── 左侧：角色头像框 + 血量/蓝量 ── -->
    <div class="hud-portrait">
      <div class="portrait-frame">
        <div class="portrait-icon">🛡</div>
        <div class="portrait-level">Lv <b id="hud-level">1</b></div>
      </div>
      <div class="portrait-bars">
        <div class="bar hp"><div id="hp-fill" class="fill"></div><span id="hp-text">100/100</span></div>
        <div class="bar mp"><div id="mp-fill" class="fill"></div><span id="mp-text">50/50</span></div>
        <div class="bar exp"><div id="exp-fill" class="fill"></div><span id="exp-text">0/100</span></div>
        <div class="portrait-stats">
          <span class="stat-atk">⚔ <b id="stat-attack">12</b></span>
          <span class="stat-def">🛡 <b id="stat-defense">3</b></span>
          <span class="stat-gold">💰 <b id="hud-gold">0</b></span>
        </div>
      </div>
    </div>

    <!-- ── 底部中央：技能栏 + Buff 栏 ── -->
    <div id="buff-bar" class="buff-bar"></div>
    <div class="skill-bar-wrapper">
      <div class="skill-bar-frame">
        <div class="skill-bar-ornament left">◄</div>
        <div id="skill-bar" class="skill-bar"></div>
        <div class="skill-bar-ornament right">►</div>
      </div>
    </div>

    <!-- ── 右下角：游戏菜单 + 操作提示 ── -->
    <div class="hud-bottom-right">
      <div class="game-menu" id="game-menu">
        <button class="gm-btn" data-action="inventory" title="背包/装备 (I)">
          <span class="gm-icon">🎒</span><span class="gm-label">背包</span><span class="gm-key">I</span>
        </button>
        <button class="gm-btn" data-action="quest" title="任务日志 (L)">
          <span class="gm-icon">📜</span><span class="gm-label">任务</span><span class="gm-key">L</span>
        </button>
        <button class="gm-btn" data-action="friend" title="好友 (F)">
          <span class="gm-icon">👥</span><span class="gm-label">好友</span><span class="gm-key">F</span>
        </button>
        <button class="gm-btn" data-action="guild" title="公会">
          <span class="gm-icon">🏰</span><span class="gm-label">公会</span>
        </button>
        <div class="gm-sep"></div>
        <button class="gm-btn gm-disabled" data-action="skills" title="技能树 (暂未开放)">
          <span class="gm-icon">⚔</span><span class="gm-label">技能</span>
        </button>
        <button class="gm-btn gm-disabled" data-action="map" title="世界地图 (暂未开放)">
          <span class="gm-icon">🗺</span><span class="gm-label">地图</span>
        </button>
        <button class="gm-btn gm-disabled" data-action="settings" title="设置 (暂未开放)">
          <span class="gm-icon">⚙</span><span class="gm-label">设置</span>
        </button>
      </div>
    </div>

    <!-- ── 右上角：小地图罗盘 ── -->
    <div id="minimap" class="minimap-container">
      <canvas class="minimap-canvas"></canvas>
      <button class="minimap-toggle" title="收起/展开">▼</button>
    </div>

    <!-- ── 右侧：任务追踪 HUD ── -->
    <div id="quest-tracker" class="quest-tracker">
      <div class="quest-tracker-title">任务追踪</div>
      <div id="quest-tracker-list" class="quest-tracker-list"></div>
    </div>

    <!-- ── 左侧：调试数据打印（默认收起） ── -->
    <div id="debug-panel" class="collapsed">
      <div class="debug-head">
        <span class="debug-toggle" id="debug-toggle">▶</span>
        <span class="debug-icon">🔧</span> 调试数据
      </div>
      <div id="debug-body" class="debug-body">
        <div class="debug-row">
          <select id="debug-type" class="debug-select">
            <option value="terrain">地形数据 (10m内)</option>
            <option value="self">自身实体球数据</option>
            <option value="npc">可见NPC数据</option>
            <option value="monster">可见怪物数据</option>
          </select>
          <button id="debug-print" class="debug-print-btn">打印</button>
        </div>
        <!-- ── 自动化测试插件控制（autobot.js） ── -->
        <div class="debug-row autobot-row">
          <span class="autobot-label">🤖 自动化测试</span>
          <button id="ab-toggle" class="debug-print-btn">开始</button>
          <span id="ab-status" class="autobot-status">停止</span>
        </div>
        <div class="debug-row autobot-log-row">
          <span id="ab-stat" class="autobot-label" style="font-weight:400">—</span>
        </div>
        <div id="ab-log" class="autobot-log"></div>
      </div>
    </div>

    <!-- ── 左侧：协议监控（默认收起） ── -->
    <div id="proto-panel" class="collapsed">
      <div class="proto-head">
        <span class="proto-toggle" id="proto-toggle">▶</span>
        <span class="proto-icon">📡</span> 协议监控 <span id="proto-bps">-</span>
      </div>
      <div id="proto-log"></div>
    </div>

    <!-- ── 左下角：聊天栏 ── -->
    <div id="chat-bar" class="chat-bar">
      <div class="chat-tabs">
        <button class="chat-tab active" data-channel="3">世界</button>
        <button class="chat-tab" data-channel="1">好友</button>
        <button class="chat-tab" data-channel="2">公会</button>
        <button class="chat-tab" data-channel="0">私聊</button>
      </div>
      <div id="chat-messages" class="chat-messages"></div>
      <div class="chat-input-row">
        <input id="chat-target" class="chat-target hidden" type="text" placeholder="目标玩家" />
        <input id="chat-input" class="chat-input" type="text" placeholder="输入消息，Enter 发送…" maxlength="200" />
        <button id="chat-send" class="chat-send">发送</button>
      </div>
    </div>
  </div>

  <!-- ═══════════ 背包/装备面板 ═══════════ -->
  <div id="inventory-panel" class="panel hidden">
    <div class="panel-head">
      <span class="panel-title-icon">🎒</span>
      <span>背包 / 装备</span>
      <button id="inv-close" class="panel-close">✕</button>
    </div>
    <div class="inv-body">
      <div id="equip-list" class="equip-list"></div>
      <div id="inv-grid" class="inv-grid"></div>
    </div>
  </div>

  <!-- ═══════════ 商店面板 ═══════════ -->
  <div id="shop-panel" class="panel hidden">
    <div class="panel-head">
      <span class="panel-title-icon">🏪</span>
      <span id="shop-title">商店</span>
      <button id="shop-close" class="panel-close">✕</button>
    </div>
    <div id="shop-tabs" class="shop-tabs"></div>
    <div id="shop-list" class="shop-list"></div>
  </div>

  <!-- ═══════════ 任务日志面板 ═══════════ -->
  <div id="quest-panel" class="panel quest-panel hidden">
    <div class="panel-head">
      <span class="panel-title-icon">📜</span>
      <span>任务日志</span>
      <button id="quest-close" class="panel-close">✕</button>
    </div>
    <div class="quest-tabs">
      <button class="quest-tab active" data-tab="available">可接任务</button>
      <button class="quest-tab" data-tab="active">进行中</button>
      <button class="quest-tab" data-tab="completed">已完成</button>
    </div>
    <div id="quest-content" class="quest-content"></div>
  </div>

  <!-- ═══════════ 好友面板 ═══════════ -->
  <div id="friend-panel" class="panel social-panel hidden">
    <div class="panel-head">
      <span class="panel-title-icon">👥</span>
      <span>好友</span>
      <button id="friend-close" class="panel-close">✕</button>
    </div>
    <div class="friend-tabs">
      <button class="friend-tab active" data-tab="list">好友列表</button>
      <button class="friend-tab" data-tab="requests">好友请求</button>
      <button class="friend-tab" data-tab="block">黑名单</button>
    </div>
    <div class="friend-add-row">
      <input id="friend-add-name" type="text" placeholder="输入玩家名" maxlength="16" />
      <button id="friend-add-btn" class="social-btn">添加好友</button>
    </div>
    <div id="friend-content" class="social-content"></div>
  </div>

  <!-- ═══════════ 公会面板 ═══════════ -->
  <div id="guild-panel" class="panel social-panel guild-panel hidden">
    <div class="panel-head">
      <span class="panel-title-icon">🏰</span>
      <span>公会</span>
      <button id="guild-close" class="panel-close">✕</button>
    </div>
    <div class="guild-tabs">
      <button class="guild-tab active" data-tab="my">我的公会</button>
      <button class="guild-tab" data-tab="search">搜索公会</button>
      <button class="guild-tab" data-tab="create">创建公会</button>
    </div>
    <div id="guild-content" class="social-content"></div>
  </div>

  <!-- ═══════════ NPC 对话面板 ═══════════ -->
  <div id="npc-dialog" class="npc-dialog hidden">
    <div class="npc-dialog-head">
      <span class="npc-dialog-icon">💬</span>
      <span id="npc-dialog-name">NPC</span>
      <button id="npc-dialog-close" class="panel-close">✕</button>
    </div>
    <div class="npc-dialog-body">
      <div id="npc-dialog-text" class="npc-dialog-text"></div>
      <div id="npc-dialog-options" class="npc-dialog-options"></div>
    </div>
  </div>

  <!-- 铁匠面板（阶段2 强化 + 阶段3 分解；页签切换） -->
  <div id="enhance-panel" class="panel enhance-panel hidden">
    <div class="panel-head">
      <span class="panel-title-icon">⚒️</span>
      <span>铁匠铺</span>
      <button id="enhance-close" class="panel-close">✕</button>
    </div>
    <div class="smith-tabs">
      <button id="smith-tab-enhance" class="smith-tab active">强化</button>
      <button id="smith-tab-decompose" class="smith-tab">分解</button>
    </div>
    <div id="enhance-body" class="enhance-body">
      <div id="enhance-list" class="enhance-list"></div>
      <div id="enhance-detail" class="enhance-detail"></div>
    </div>
    <div id="decompose-body" class="enhance-body hidden">
      <div id="decompose-list" class="enhance-list"></div>
      <div id="decompose-detail" class="enhance-detail"></div>
    </div>
  </div>

  <!-- 合成面板（阶段4：配方驱动合成；炼金术士/铠甲匠人） -->
  <div id="craft-panel" class="panel enhance-panel hidden">
    <div class="panel-head">
      <span class="panel-title-icon">⚗️</span>
      <span>物品合成</span>
      <button id="craft-close" class="panel-close">✕</button>
    </div>
    <div id="craft-body" class="enhance-body">
      <div id="craft-list" class="enhance-list"></div>
      <div id="craft-detail" class="enhance-detail"></div>
    </div>
  </div>

  <!-- 仓库面板（阶段5：多页存储/扩展/锁定/存金；银行职员） -->
  <div id="warehouse-panel" class="panel warehouse-panel hidden">
    <div class="panel-head">
      <span class="panel-title-icon">🏦</span>
      <span>银行仓库</span>
      <button id="warehouse-close" class="panel-close">✕</button>
    </div>
    <div id="warehouse-goldbar" class="warehouse-goldbar"></div>
    <div id="warehouse-pages" class="warehouse-pages"></div>
    <div class="warehouse-body">
      <div class="warehouse-col">
        <div class="warehouse-col-title">背包 <span class="wh-col-hint">点击存入</span></div>
        <div id="warehouse-bag" class="warehouse-grid"></div>
      </div>
      <div class="warehouse-col">
        <div class="warehouse-col-title">仓库 <span class="wh-col-hint">点击取出</span></div>
        <div id="warehouse-slots" class="warehouse-grid"></div>
      </div>
    </div>
    <div id="warehouse-footer" class="warehouse-footer"></div>
  </div>

  <!-- ═══════════ 控制台面板（~ 键开关，功能测试用） ═══════════ -->
  <div id="console-panel" class="console-panel hidden">
    <div class="console-head">
      <span class="console-title">🖥 控制台</span>
      <span class="console-hint">输入 <b>help</b> 查看命令 · <kbd>~</kbd>/<kbd>Esc</kbd> 关闭</span>
      <button id="console-clear" class="console-mini-btn" title="清空日志">清空</button>
      <button id="console-close" class="panel-close" title="关闭">✕</button>
    </div>
    <div id="console-log" class="console-log"></div>
    <div class="console-input-row">
      <span class="console-prompt">&gt;</span>
      <input id="console-input" class="console-input" type="text"
             placeholder="输入命令后回车…" autocomplete="off" spellcheck="false" maxlength="200" />
    </div>
  </div>

  <!-- ═══════════ 提示浮层 ═══════════ -->
  <div id="toast" class="toast"></div>

  <!-- ═══════════ 死亡遮罩 ═══════════ -->
  <div id="death-overlay" class="death-overlay hidden">
    <div class="death-vignette"></div>
    <div class="death-content">
      <div class="death-skull">☠</div>
      <div class="death-title">你已阵亡</div>
      <div class="death-sub">正在等待复活…</div>
      <div id="death-count" class="death-count">3.0s</div>
    </div>
  </div>

  <script type="module" src="./js/boot.js"></script>
</body>
</html>
