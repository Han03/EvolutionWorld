<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EvolutionWorld · 无缝世界</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <!-- 3D 渲染容器 -->
  <div id="app"></div>

  <!-- 登录界面 -->
  <div id="login-overlay" class="overlay">
    <div class="login-card">
      <h1 class="title">EVOLUTION<span>WORLD</span></h1>
      <p class="subtitle">无缝世界 · 固定俯视角大型MMO · 空壳网络游戏服务端</p>
      <form id="login-form" autocomplete="off">
        <label>账号</label>
        <input id="username" type="text" placeholder="2-16 位字母/数字/中文" maxlength="16" />
        <label>密码</label>
        <input id="password" type="password" placeholder="6-64 位" maxlength="64" />
        <div id="login-msg" class="msg"></div>
        <div class="btn-row">
          <button type="button" id="btn-register" class="btn btn-ghost">注册</button>
          <button type="submit" id="btn-login" class="btn btn-primary">登录</button>
        </div>
      </form>
      <div class="hint">登录后将以 <b>橙色球体</b> 进入无缝世界（固定俯视角）<br/>绿色=其他玩家 · 红色=怪物 · 蓝色=NPC</div>
    </div>
  </div>

  <!-- 加载遮罩 -->
  <div id="loading" class="loading hidden">
    <div class="spinner"></div>
    <span id="loading-text">连接世界中…</span>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="hud-title">EVOLUTIONWORLD</div>
      <div id="hud-conn" class="hud-chip">…</div>
    </div>
    <div id="boss-bar" class="hidden">
      <div id="boss-name">世界Boss</div>
      <div class="boss-track"><div id="boss-fill"></div></div>
      <span id="boss-hp">0/0</span>
    </div>
    <div class="hud-bottom">
      <div id="hud-info">
        <div><b id="hud-user">-</b></div>
        <div id="hud-pos">x:0 y:0 z:0</div>
        <div id="hud-fps">fps:0</div>
      </div>
      <!-- 属性系统 HUD：血量/蓝量/攻击/防御/金币 -->
      <div class="hud-vitals">
        <div class="bar hp"><div id="hp-fill" class="fill"></div><span id="hp-text">100/100</span></div>
        <div class="bar mp"><div id="mp-fill" class="fill"></div><span id="mp-text">50/50</span></div>
        <div class="hud-stats">
          <span>⚔ <b id="stat-attack">12</b></span>
          <span>🛡 <b id="stat-defense">3</b></span>
          <span class="hud-gold">💰 <b id="hud-gold">0</b></span>
        </div>
      </div>
      <div class="hud-controls">
        <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>↑←↓→</kbd> 移动</div>
        <div><kbd>Space</kbd> 跳跃 · <kbd>J</kbd> 攻击 · <kbd>B</kbd> 商店(靠近老板) · <kbd>E</kbd> 拾取 · <kbd>I</kbd> 背包/装备</div>
      </div>
    </div>
  </div>
  <!-- 背包/装备面板（I 键） -->
  <div id="inventory-panel" class="panel hidden">
    <div class="panel-head"><span>背包 / 装备</span><button id="inv-close" class="panel-close">×</button></div>
    <div class="inv-body">
      <div id="equip-list" class="equip-list"></div>
      <div id="inv-grid" class="inv-grid"></div>
    </div>
  </div>
  <!-- 商店面板（B 键，靠近商店 NPC 打开） -->
  <div id="shop-panel" class="panel hidden">
    <div class="panel-head"><span id="shop-title">商店</span><button id="shop-close" class="panel-close">×</button></div>
    <div id="shop-list" class="shop-list"></div>
  </div>
  <!-- 提示浮层 -->
  <div id="toast" class="toast"></div>
  <!-- 协议透传转换监控：二进制帧 → 可读对象 实时解码展示 -->
  <div id="proto-panel">
    <div class="proto-head">协议透传 <span id="proto-bps">-</span></div>
    <div id="proto-log"></div>
  </div>

  <script type="module" src="./js/boot.js"></script>
</body>
</html>
