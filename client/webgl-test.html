<!DOCTYPE html>
<html><body>
<h1>WebGL 探测</h1>
<pre id="out">…</pre>
<script>
const out = document.getElementById('out');
try {
  const c = document.createElement('canvas');
  const gl = c.getContext('webgl2') || c.getContext('webgl');
  if (gl) {
    const info = gl.getParameter(gl.VERSION);
    out.textContent = 'WebGL OK: ' + info;
  } else {
    out.textContent = 'WebGL NOT AVAILABLE';
  }
} catch (e) {
  out.textContent = 'WebGL ERROR: ' + e.message;
}
</script>
</body></html>
