name: CI - Build, Deploy & Keep Server Running (WSL)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-start:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Build C++ server in WSL Ubuntu
        run: |
          $ws = $env:GITHUB_WORKSPACE
          $wsl = "/mnt/c" + ($ws -replace "\\", "/" -replace "^C:", "" -replace "^c:", "")
          Write-Output "Building in: $wsl/server"
          wsl -d Ubuntu -- bash -lc "cd '$wsl/server' && rm -rf build && cmake -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j"

      - name: Deploy to stable path and start server
        run: |
          $ws = $env:GITHUB_WORKSPACE
          $wsl = "/mnt/c" + ($ws -replace "\\", "/" -replace "^C:", "" -replace "^c:", "")
          # Stop old service first
          wsl -d Ubuntu -- bash -lc "systemctl stop evolution-server 2>/dev/null || true"
          # Deploy build artifacts to stable WSL path (survives runner workspace cleanup)
          wsl -d Ubuntu -- bash -lc "rm -rf /opt/evolutionworld && mkdir -p /opt/evolutionworld/server/build && cp -r '$wsl/client' /opt/evolutionworld/client && cp '$wsl/server/build/evolution_server' /opt/evolutionworld/server/build/evolution_server && chmod +x /opt/evolutionworld/server/build/evolution_server && echo DEPLOY_OK"
          # Resolve Windows host IP visible from WSL2 (for MySQL/Redis connectivity)
          $winHost = (wsl -d Ubuntu -- bash -c "grep nameserver /etc/resolv.conf | head -1 | awk '{print \$2}'").Trim()
          $ewConfig = "mysql_host=$winHost,mysql_port=3306,mysql_user=root,mysql_pass=123456,mysql_db=evolution_world,redis_host=$winHost,redis_port=6379"
          Write-Output "Windows host IP from WSL2: $winHost"
          Write-Output "EW_CONFIG: $ewConfig"
          # Point systemd service at the stable path
          $lines = @(
            "[Unit]",
            "Description=EvolutionWorld Game Server",
            "After=network.target",
            "",
            "[Service]",
            "WorkingDirectory=/opt/evolutionworld/server",
            "ExecStart=/opt/evolutionworld/server/build/evolution_server",
            "Environment=EW_DEBUG=1",
            "Environment=EW_CONFIG=$ewConfig",
            "Restart=no",
            "",
            "[Install]",
            "WantedBy=multi-user.target"
          )
          $svc = ($lines -join "`n") + "`n"
          $b64 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($svc))
          wsl -d Ubuntu -- bash -lc "echo $b64 | base64 -d > /etc/systemd/system/evolution-server.service && systemctl daemon-reload && systemctl start evolution-server && echo SERVER_STARTED"
          Write-Output "Server address: http://localhost:3000"

      - name: Health check
        run: |
          $ok = $false
          for ($i = 0; $i -lt 20; $i++) {
            try {
              $r = Invoke-RestMethod -Uri "http://localhost:3000/api/health" -TimeoutSec 3
              if ($r.ok) { Write-Output "HEALTH OK: $($r | ConvertTo-Json -Compress)"; $ok = $true; break }
            } catch {}
            Start-Sleep -Seconds 3
          }
          if (-not $ok) { throw "Server failed health check" }

      - name: Server kept running for manual testing
        run: |
          Write-Output "=============================================="
          Write-Output " Game server deployed to /opt/evolutionworld"
          Write-Output " and is now RUNNING and left alive."
          Write-Output " Open http://localhost:3000 in your browser"
          Write-Output " to manually test the latest build."
          Write-Output "=============================================="
