name: CI - Build, Deploy & Keep Server Running (WSL)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-start:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Force kill WSL at Windows level
        run: |
          # wsl --shutdown hangs when a user session is active; kill at Windows level instead
          Get-Process -Name wslservice -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name wslhost -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          # Fallback: taskkill works even when Stop-Process lacks permissions
          taskkill /F /IM wslservice.exe; $true
          taskkill /F /IM wslhost.exe; $true
          Start-Sleep -Seconds 2
          # Verify WSL is responsive
          wsl -d Ubuntu -- echo "WSL ready"

      - name: Build C++ server in WSL Ubuntu
        run: |
          $ws = $env:GITHUB_WORKSPACE
          $wsl = "/mnt/c" + ($ws -replace "\\", "/" -replace "^C:", "" -replace "^c:", "")
          Write-Output "Building in: $wsl/server"
          wsl -d Ubuntu -- bash -c "cd '$wsl/server' && rm -rf build && cmake -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j"

      - name: Deploy to stable path and start server
        run: |
          $ws = $env:GITHUB_WORKSPACE
          $wsl = "/mnt/c" + ($ws -replace "\\", "/" -replace "^C:", "" -replace "^c:", "")
          # Stop old server process directly (systemctl hangs when user WSL session is active)
          wsl -d Ubuntu -- bash -c "pkill -f evolution_server 2>/dev/null || true"
          # Deploy build artifacts to stable WSL path (survives runner workspace cleanup)
          wsl -d Ubuntu -- bash -c "rm -rf /opt/evolutionworld && mkdir -p /opt/evolutionworld/server/build && cp -r '$wsl/client' /opt/evolutionworld/client && cp '$wsl/server/build/evolution_server' /opt/evolutionworld/server/build/evolution_server && chmod +x /opt/evolutionworld/server/build/evolution_server && echo DEPLOY_OK"
          # Resolve Windows host IP visible from WSL2 (for MySQL/Redis connectivity)
          $winHost = (wsl -d Ubuntu -- bash -c "grep nameserver /etc/resolv.conf | head -1 | awk '{print \$2}'").Trim()
          $ewConfig = "mysql_host=$winHost,mysql_port=3306,mysql_user=root,mysql_pass=123456,mysql_db=evolution_world,redis_host=$winHost,redis_port=6379"
          Write-Output "Windows host IP from WSL2: $winHost"
          Write-Output "EW_CONFIG: $ewConfig"
          # Start server directly in background (systemctl hangs when user WSL session is active)
          wsl -d Ubuntu -- bash -c "cd /opt/evolutionworld/server && EW_DEBUG=1 EW_CONFIG='$ewConfig' nohup ./build/evolution_server > /tmp/evolution_server.log 2>&1 & echo SERVER_STARTED pid=\$!"
          Write-Output "Server address: http://localhost:3000"

      - name: Health check
        run: |
          $ok = $false
          for ($i = 0; $i -lt 20; $i++) {
            try {
              $r = Invoke-RestMethod -Uri "http://localhost:3000/api/health" -TimeoutSec 3
              if ($r.ok) { Write-Output "HEALTH OK: $($r | ConvertTo-Json -Compress)"; $ok = $true; break }
            } catch {}
            Start-Sleep -Seconds 3
          }
          if (-not $ok) { throw "Server failed health check" }

      - name: Server kept running for manual testing
        run: |
          Write-Output "=============================================="
          Write-Output " Game server deployed to /opt/evolutionworld"
          Write-Output " and is now RUNNING and left alive."
          Write-Output " Open http://localhost:3000 in your browser"
          Write-Output " to manually test the latest build."
          Write-Output "=============================================="
